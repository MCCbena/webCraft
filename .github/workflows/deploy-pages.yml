name: Deploy WebCraft to GitHub Pages

# GitHub Pages in this environment serves the main branch directly
# (legacy build; the Pages source cannot be changed via API). So this
# workflow builds the game and commits the bundle to assets/ on main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skip pushes created by this workflow itself (deploy commits) to avoid loops.
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'deploy:')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit built bundle to main
        run: |
          rm -rf assets
          cp -r dist/assets assets
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --staged --quiet; then
            echo "No asset changes; skipping deploy commit."
          else
            git commit -m "deploy: update built assets"
            git push
          fi
